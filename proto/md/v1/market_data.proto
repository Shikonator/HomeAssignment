syntax = "proto3";

package md.v1;

// =============================================================================
// Consolidated BTCUSDT market data, aggregated across multiple centralised
// exchanges.
//
// NUMERIC CONVENTION
//   Every `*_e8` field is a fixed-point signed integer scaled by 1e8.
//       100000.25 USDT       -> 10000025000000
//       0.5 BTC              -> 50000000
//       1.25 bps             -> 125000000
//   The scale is also transmitted in SnapshotMeta so a client never has to
//   hardcode it.
//
//   Rationale: exchanges publish prices as exact decimal strings. IEEE-754
//   doubles cannot represent them exactly, so a double round-trip perturbs
//   price levels and makes book keys compare unequal. int64 is exact and
//   compares in one instruction.
//
//   All divisions truncate toward zero. Notional is always in QUOTE currency
//   (USDT), i.e. sum(price * qty).
//
// TIME CONVENTION
//   Every `*_ts_ns` field is Unix epoch nanoseconds. Fields named `recv` are
//   stamped on LOCAL receipt and are the only ones used for staleness
//   decisions; fields named `exchange` are the venue's own clock, reproduced
//   for information only and never trusted for ordering.
//
// DELIVERY CONVENTION
//   All streams are conflating: if a subscriber cannot keep up, the server
//   drops intermediate states and always sends the most recent one. A slow
//   subscriber degrades its own resolution and never applies back-pressure to
//   the book or to other subscribers. `meta.sequence` is monotonic but MAY
//   skip; a gap means conflation, not data loss.
//
//   Note the asymmetry: conflation is safe here because every message carries
//   absolute state. It is NOT safe on the venue -> aggregator path, where
//   messages are deltas and dropping one corrupts the book permanently.
// =============================================================================

service MarketData {
  // Best bid and offer of the consolidated book.
  rpc StreamBbo(StreamBboRequest) returns (stream BboUpdate);

  // Sweep prices for a set of notional-value bands (1M/5M/10M/25M/50M+ USD).
  rpc StreamVolumeBands(StreamVolumeBandsRequest) returns (stream VolumeBandsUpdate);

  // Liquidity resting within a set of bps offsets from the touch
  // (50/100/200/500/1000+ bps).
  rpc StreamPriceBands(StreamPriceBandsRequest) returns (stream PriceBandsUpdate);

  // Operational introspection: per-venue connectivity, sequencing health and
  // aggregation latency. Intended for health checks and dashboards.
  rpc GetVenueStatus(GetVenueStatusRequest) returns (GetVenueStatusResponse);
}

// -----------------------------------------------------------------------------
// Common
// -----------------------------------------------------------------------------

// Options shared by every streaming RPC. Factored out so a new view reuses
// identical subscription semantics -- a full-depth ladder view is the obvious
// next one, and is deliberately not exposed today; see README, "Why there is no
// raw ladder RPC".
message Subscription {
  // Instrument symbol. Empty defaults to the server's configured instrument
  // ("BTCUSDT"). A symbol the server does not aggregate => INVALID_ARGUMENT.
  string instrument = 1;

  // Restrict aggregation to these venues (lower-case, e.g. "binance"). Empty
  // means every configured venue. Unknown names => INVALID_ARGUMENT, so a typo
  // is never silently ignored.
  //
  // Filtering is applied by re-deriving the consolidated ladder from per-level
  // venue attribution, so it costs one extra pass and no re-merge. Because
  // merge depth is computed across ALL venues, a filtered view is bounded by
  // the unfiltered truncation point and a deep band may legitimately report
  // fully_filled = false.
  repeated string venues = 2;

  // Lower bound on the interval between two updates on this stream. 0 means
  // "send every published state". Lets a subscriber trade resolution for CPU
  // without the server guessing on its behalf.
  uint32 min_interval_micros = 3;
}

// Per-venue contribution at a single price, so a consumer can see which venue
// is actually setting the touch.
message VenueQty {
  string venue = 1;
  int64 qty_e8 = 2;
}

message Quote {
  // 0 when no contributing venue has liquidity on this side.
  int64 price_e8 = 1;
  // Total quantity resting at `price_e8`, summed across contributing venues.
  int64 qty_e8 = 2;
  repeated VenueQty venues = 3;
}

// The touch of the consolidated book, echoed on every stream so band numbers
// can be interpreted without a second subscription.
message Touch {
  // False when no contributing venue has liquidity on that side. This is a
  // real, reachable state: before the first venue syncs, when every venue has
  // gone stale, and in single-venue filtered views.
  //
  // WHEN EITHER SIDE IS ABSENT, mid_price_e8, spread_e8 and spread_bps_e8 are
  // all 0 and `crossed` is false. They are not computed from a zero price.
  bool has_bid = 1;
  bool has_ask = 2;

  int64 best_bid_e8 = 3;
  int64 best_ask_e8 = 4;

  // (best_bid + best_ask) / 2, truncated toward zero. The only stable
  // reference when the consolidated book is crossed. 0 unless both sides exist.
  int64 mid_price_e8 = 5;

  // best_ask - best_bid. SIGNED: negative when crossed. 0 unless both sides
  // exist.
  int64 spread_e8 = 6;

  // Spread relative to mid, in basis points, scaled by 1e8. Signed. 0 unless
  // both sides exist.
  int64 spread_bps_e8 = 7;

  // True when both sides exist and best_bid >= best_ask.
  //
  // This is a NORMAL condition for a consolidated book, not an error:
  // independent venues publish at different cadences and network latencies, so
  // the consolidated touch is always a blend of instants. The aggregator does
  // not clamp it, does not suppress it, and does not fee-adjust it -- doing so
  // would require a per-venue cost model that is out of scope. See README,
  // "Crossed consolidated books".
  bool crossed = 8;

  reserved 9 to 15;
}

// Per-venue clocks for this consolidated state. The consolidated book is always
// a blend of three different instants; this is how a consumer sees the skew.
message VenueClock {
  string venue = 1;
  int64 last_recv_ts_ns = 2;
  int64 last_exchange_ts_ns = 3;
}

// Provenance attached to every update, so a consumer can reason about freshness
// and degraded operation without a side channel.
message SnapshotMeta {
  string instrument = 1;

  // Monotonic aggregator publication counter. May skip: see DELIVERY CONVENTION.
  uint64 sequence = 2;

  // When the aggregator produced this consolidated state.
  int64 publish_ts_ns = 3;

  // Local receive timestamp of the most recent venue message folded into this
  // state. `publish_ts_ns - ingest_recv_ts_ns` is the internal aggregation
  // latency.
  int64 ingest_recv_ts_ns = 4;

  // Venues whose book is live and included in this state.
  repeated string contributing_venues = 5;

  // Venues deliberately excluded: disconnected, resyncing, or not heard from
  // within the staleness timeout. Non-empty means the book is degraded but
  // still usable.
  repeated string stale_venues = 6;

  repeated VenueClock venue_clocks = 7;

  // Fixed-point scales actually in use, transmitted so clients never hardcode
  // them. Both are 100000000 (1e8) in this implementation.
  int64 price_scale = 8;
  int64 qty_scale = 9;

  // True when the published ladder stopped at the configured publish depth
  // rather than at the end of the underlying books, i.e. liquidity exists that
  // this message does not describe.
  //
  // This is deliberately NOT a per-band flag. PriceBand.depth_limited answers
  // "did this band's bound outrun the ladder"; these answer "was the ladder
  // itself cut short". They are orthogonal and conflating them would make both
  // unreadable.
  bool bid_ladder_truncated = 10;
  bool ask_ladder_truncated = 11;

  reserved 12 to 20;
}

// -----------------------------------------------------------------------------
// Best bid / offer
// -----------------------------------------------------------------------------

message StreamBboRequest {
  Subscription subscription = 1;
}

message BboUpdate {
  SnapshotMeta meta = 1;
  Touch touch = 2;
  Quote bid = 3;
  Quote ask = 4;

  reserved 5 to 15;
}

// -----------------------------------------------------------------------------
// Volume bands: "if I sweep N dollars of notional, what price do I get?"
//
// Bands are CUMULATIVE FROM THE TOUCH: the 5M band describes sweeping 5M of
// notional starting at the best price, not the slice between 1M and 5M.
// -----------------------------------------------------------------------------

message StreamVolumeBandsRequest {
  Subscription subscription = 1;

  // Notional targets in quote currency, scaled 1e8 (1M USDT -> 100000000000000).
  // Empty uses the server default set (1M/5M/10M/25M/50M).
  //
  // Values must be positive, distinct, and at most 32 per request; otherwise
  // INVALID_ARGUMENT. A target the book is too thin to fill is NOT an error --
  // asking about 50M is legitimate even when no venue publishes that much
  // depth, and that case is answered by fully_filled = false on the band
  // itself.
  //
  // The server always appends one additional open-ended band (the "50M+" of the
  // specification) beyond the largest finite target.
  repeated int64 notional_bands_e8 = 2;
}

message VolumeBand {
  // Requested target, echoed so a consumer never matches by index.
  // ZERO for the trailing open-ended band, which has no target -- so this
  // field remains an unambiguous key across the whole repeated set.
  int64 notional_target_e8 = 1;

  // Quantity-weighted average fill price for the sweep.
  int64 vwap_price_e8 = 2;

  // Price of the last level touched -- the marginal / worst price.
  int64 worst_price_e8 = 3;

  int64 filled_qty_e8 = 4;
  int64 filled_notional_e8 = 5;

  // False only when the BOOK ran out before the target was met. Partial
  // consumption of the boundary level is normal, is included in
  // vwap/qty/notional, and does NOT clear this flag.
  //
  // Always false for the open-ended band, which exhausts the ladder by
  // construction and for which "the target was met" has no meaning.
  bool fully_filled = 6;

  int32 levels_consumed = 7;

  // True for the trailing open-ended band, which sweeps ALL available
  // consolidated liquidity rather than a finite target.
  bool open_ended = 8;

  reserved 9 to 15;
}

message VolumeBandsUpdate {
  SnapshotMeta meta = 1;
  Touch touch = 2;
  // Sweeping resting bids (i.e. selling). Prices descend.
  repeated VolumeBand bid = 3;
  // Sweeping resting offers (i.e. buying). Prices ascend.
  repeated VolumeBand ask = 4;

  reserved 5 to 15;
}

// -----------------------------------------------------------------------------
// Price bands: "how much liquidity rests within X bps of the touch?"
//
// Also CUMULATIVE FROM THE TOUCH, and measured from the OWN-SIDE touch
// (best_bid for bid bands, best_ask for ask bands). `Touch.mid_price_e8` is
// emitted alongside so a consumer can reinterpret against mid without guessing.
// -----------------------------------------------------------------------------

message StreamPriceBandsRequest {
  Subscription subscription = 1;

  // Offsets from the touch in basis points, scaled by 1e8 (50 bps ->
  // 5000000000), so that fractional offsets such as 12.5 bps are expressible
  // and the *_e8 convention holds everywhere. Empty uses the server default
  // set (50/100/200/500/1000).
  //
  // Values must be positive, distinct, and at most 32 per request; otherwise
  // INVALID_ARGUMENT. An offset wider than the published ladder is NOT an
  // error; it is answered by depth_limited = true on the band itself.
  //
  // The server always appends one additional open-ended band (the "1000bps+" of
  // the specification) beyond the largest finite offset.
  repeated int64 offsets_bps_e8 = 2;
}

message PriceBand {
  int64 offset_bps_e8 = 1;

  // Inclusive worst price of the band:
  //   bid side: best_bid * (1 - bps/1e4), rounded DOWN
  //   ask side: best_ask * (1 + bps/1e4), rounded UP
  //
  // Rounding is outward on BOTH sides deliberately. Truncating toward zero
  // would widen the bid band and narrow the ask band by up to one unit, so a
  // level resting exactly on the boundary would be included on one side and
  // excluded on the other for the same offset. Rounding outward makes the
  // bound inclusive symmetrically.
  //
  // For the open-ended band this is the worst price actually present in the
  // published ladder.
  int64 bound_price_e8 = 2;

  // Cumulative liquidity from the touch out to `bound_price_e8`.
  int64 qty_e8 = 3;
  int64 notional_e8 = 4;
  int64 vwap_price_e8 = 5;
  int32 levels = 6;

  // True for the trailing open-ended band, covering everything beyond the
  // largest finite offset to the end of the consolidated ladder. Its
  // offset_bps_e8 is 0 (it has no offset) and its bound_price_e8 is the worst
  // price actually present.
  bool open_ended = 7;

  // True when the published ladder ended before `bound_price_e8` was
  // reached, so this band reports all available depth rather than the depth
  // within the requested offset. Expected for wide offsets: venues publish
  // bounded depth, and 1000 bps on BTCUSDT is far outside what any of them
  // stream.
  //
  // Always FALSE for the open-ended band, whose bound is by definition the end
  // of the ladder and is therefore always reached.
  bool depth_limited = 8;

  reserved 9 to 15;
}

message PriceBandsUpdate {
  SnapshotMeta meta = 1;
  Touch touch = 2;
  repeated PriceBand bid = 3;
  repeated PriceBand ask = 4;

  reserved 5 to 15;
}

// -----------------------------------------------------------------------------
// Operational status
// -----------------------------------------------------------------------------

enum ConnState {
  CONN_STATE_UNSPECIFIED = 0;
  CONN_STATE_DISCONNECTED = 1;
  CONN_STATE_CONNECTING = 2;
  // Connected, but the local book is not yet provably in sync with the venue.
  CONN_STATE_SYNCING = 3;
  // In sync and contributing to the consolidated view.
  CONN_STATE_LIVE = 4;
  // Live but not heard from within the staleness timeout; excluded from the
  // merge until it speaks again.
  CONN_STATE_STALE = 5;
}

message LatencyStats {
  int64 p50_ns = 1;
  int64 p99_ns = 2;
  int64 max_ns = 3;
  uint64 count = 4;
}

message VenueStatus {
  string venue = 1;
  // Venue-native symbol actually subscribed (e.g. "BTC-USDT" on OKX).
  string venue_symbol = 2;
  ConnState state = 3;
  int64 last_recv_ts_ns = 4;
  int64 last_exchange_ts_ns = 5;
  uint64 messages = 6;
  // Times the local book was rebuilt from a fresh snapshot.
  uint64 resyncs = 7;
  // Sequence discontinuities detected. Each forces a resync; a growing value
  // means the feed is lossy.
  uint64 sequence_gaps = 8;
  // Times an inbound batch was dropped because the ingest ring was full, each
  // of which also forces a resync.
  uint64 ring_overflows = 9;
  int32 bid_levels = 10;
  int32 ask_levels = 11;
  int64 best_bid_e8 = 12;
  int64 best_ask_e8 = 13;
}

message GetVenueStatusRequest {
  string instrument = 1;
}

message GetVenueStatusResponse {
  repeated VenueStatus venues = 1;
  uint64 published_snapshots = 2;
  // Venue receive -> consolidated publish, measured inside the aggregator.
  LatencyStats aggregation_latency = 3;
  int64 server_ts_ns = 4;
  int64 uptime_ns = 5;
}
